[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "contract: lifecycle semantics and invariants",
  "artifact: artifact-store and normalized payload regression tests",
  "stage: stage-runner tests",
  "persistence: repository and DB integrity tests",
  "pipeline: end-to-end ingest tests",
  "slow: slower DB/vector/PDF tests",
]
