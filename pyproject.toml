[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "doc-forge"
version = "0.1.0"
description = "Python semantic RAG baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2.13.1",
  "pypdf>=5.0.0",
  "python-dotenv>=1.2.2",
  "python-multipart",
  "sqlalchemy>=2,<3",
  "structlog>=25.5.0",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.0",
  "pyright>=1.1.408",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "testcontainers[postgres]>=4.14.1",
]
llm = [
    "sentence-transformers>=5.2.3",
    "torch>=2.10.0",
]
mac = [
    "mlx-lm>=0.31.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts", "e2e"]
exclude = [
  ".venv/**",
  "**/.venv",
  "**/.venv/**",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".tmp_mineru",
  "data",
  "output",
]
reportMissingTypeStubs = false
executionEnvironments = [
  { root = ".", extraPaths = ["src"] },
]

[tool.pytest.ini_options]
addopts = "-q -m 'not e2e'"
markers = [
  "contract: lifecycle semantics and invariant tests",
  "persistence: db-backed integrity and repository tests",
  "artifacts: filesystem-backed artifact persistence tests",
  "e2e: docker-backed end-to-end lifecycle tests",
]
norecursedirs = ["tests/mvp_document_lifecycle_tests_split"]
testpaths = ["tests"]
