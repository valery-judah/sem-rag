[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "parity"
version = "0.1.0"
description = "Python semantic RAG baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2,<3",
  "pypdf>=5.0.0",
  "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
parity = "parity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "contract: lifecycle semantics and invariant tests",
  "persistence: db-backed integrity and repository tests",
  "artifacts: filesystem-backed artifact persistence tests",
]
testpaths = ["tests"]
