services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parity
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: parity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d parity"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "5432:5432"

  migrate:
    build: .
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://parity:parity@db:5432/parity
      PARITY_ARTIFACT_ROOT: /artifacts
    volumes:
      - ./data:/artifacts
    restart: "no"

  api:
    build: .
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://parity:parity@db:5432/parity
      PARITY_ARTIFACT_ROOT: /artifacts
      PORT: "8000"
    volumes:
      - ./data:/artifacts
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://parity:parity@db:5432/parity
      PARITY_ARTIFACT_ROOT: /artifacts
      PARITY_WORKER_POLL_SECONDS: "0.1"
    volumes:
      - ./data:/artifacts
